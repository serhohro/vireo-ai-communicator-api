[package]
name = "vireo"
version = "3.0.0"
edition = "2021"
description = "Vireo — The World's First AI-to-AI Communication Language"
license = "Apache-2.0"
authors = ["Serhii <serhohro@vireo.ai>"]

[dependencies]
ed25519-dalek = "2.0"
blake2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false