name: Vireo Conformance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  python:
    name: Python SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynacl pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run conformance tests
        run: pytest tests/conformance/ -v

      - name: Regenerate test vector and verify stability
        run: |
          cp tests/conformance/vectors/001_propose_commit.json /tmp/before.json
          python scripts/generate_test_vectors.py
          python - <<'PY'
          import json, sys
          before = json.load(open('/tmp/before.json'))
          after  = json.load(open('tests/conformance/vectors/001_propose_commit.json'))
          if before['expected_outputs'] != after['expected_outputs']:
              print("ERROR: vector is non-deterministic")
              sys.exit(1)
          print("OK: vector regeneration is deterministic")
          PY

  rust:
    name: Rust SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sdk/rust/Cargo.lock') }}

      - name: Build SDK
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --lib --verbose

      - name: Cross-language conformance test
        run: cargo test --test test_vectors -- --nocapture

  typescript:
    name: TypeScript SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run conformance tests
        run: npm test

  conformance-status:
    name: North Star
    runs-on: ubuntu-latest
    needs: [python, rust, typescript]
    steps:
      - name: All conformance checks passed
        run: echo "✅ Python ↔ Rust ↔ TypeScript byte-identical. North Star achieved."
